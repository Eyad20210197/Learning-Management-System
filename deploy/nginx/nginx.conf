worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 1m;
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

  upstream lms_api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 8080;
    listen [::]:8080;

    location = /health/live {
      proxy_pass http://lms_api/api/v1/health/live;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /health/ready {
      proxy_pass http://lms_api/api/v1/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://lms_api;
    }

    # Cloudflare must intercept /media/* with the Worker route. Reaching the
    # origin directly is always denied, preventing a gateway bypass.
    location /media/ {
      return 404;
    }

    location / {
      return 404;
    }
  }
}
